<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/all.min.css" />
    <link rel="stylesheet" href="css/style.css" />
    <title>Weather App</title>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand d-flex align-items-center" href="#">
          <img src="imgs/logo.png" alt="logo" class="me-2" />
          <div>
            <h1 class="h6 mb-0 text-white">Weather</h1>
            <small>tagline goes here</small>
          </div>
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="#">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">News</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">Live cameras</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">Photos</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">Contact</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="py-5">
      <div class="container">
        <div class="search-container position-relative mb-5">
          <input
            type="text"
            class="form-control"
            id="searchInput"
            placeholder="Find your location..."
          />
          <button class="btn btn-primary position-absolute" id="searchBtn">
            Find
          </button>
        </div>

        <div class="forecast-container">
          <div class="row" id="forecast"></div>
        </div>
      </div>
    </main>

    <footer class="bg-dark py-5 text-white">
      <div class="container">
        <div class="row align-items-center">
          <div class="col-md-8">
            <div class="subscribe-container position-relative">
              <input
                type="text"
                class="form-control"
                placeholder="Enter your email to subscribe..."
              />
              <button class="btn btn-primary position-absolute">
                Subscribe
              </button>
            </div>
          </div>
          <div class="col-md-4">
            <div class="social-links text-center text-md-end">
              <a href="#" class="text-white me-3"
                ><i class="fab fa-facebook-f"></i
              ></a>
              <a href="#" class="text-white me-3"
                ><i class="fab fa-twitter"></i
              ></a>
              <a href="#" class="text-white me-3"
                ><i class="fab fa-google-plus-g"></i
              ></a>
              <a href="#" class="text-white"
                ><i class="fab fa-pinterest"></i
              ></a>
            </div>
          </div>
        </div>
        <p class="mt-4 mb-0 text-center text-md-start">
          Copyright 2014 Company name. Designed by Themezy. All rights reserved
        </p>
      </div>
    </footer>

    <script src="javascript/bootstrap.bundle.min.js"></script>
    <script src="javascript/script.js"></script>
  </body>
</html>
